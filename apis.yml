name: Azure Notification Hubs
description: Azure Notification Hubs is a massively scalable mobile push notification engine that enables sending push notifications
  to iOS, Android, Windows, and other platforms. It supports device registration, tag-based routing, template notifications,
  scheduled sends, and telemetry for tracking delivery metrics.
